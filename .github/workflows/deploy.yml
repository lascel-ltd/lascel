name: Build and publish

# Pull requests to main: install, lint, type-check and build.
# Pushes to main, and manual runs on main: the same, then publish out/ to GitHub Pages.
# GitHub Pages must be set to deploy from GitHub Actions (Settings > Pages > Source).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # A newer commit on the same pull request cancels the older run.
      group: build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build the static site
        run: npm run build

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # Keep public/.nojekyll in the published files.
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      # One deployment at a time. A deployment in progress is never cancelled.
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check the GitHub Pages settings
        uses: actions/configure-pages@v6

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
